assumptions:
  - "Template/LOC counts follow canton-pitch-deck.md (54 templates, ~5,700 LOC) over asset-manager-pitch-deck.md (36 templates, ~5,100 LOC) per the brief's stated source priority. The two decks disagree; the discrepancy is logged in NOTES.md, not resolved."
  - "Compliance-memo length cited as ~2,900 lines (canton deck) rather than 2,600 (asset-manager deck), same priority rule."
  - "The audience holds a credibility judgment plus the authority to grant a conversation. The brief says the ask is a conversation; it does not name who signs anything, and nothing in the arc depends on their signing."
  - "Both source decks' capital asks (Foundation funding; $5–50M strategic + $10–25M pilot) are OUT of scope by the brief's framing, so the arc's `standing` beat ends on an intellectual ask instead."
  - "Video staged at 120s: the brief allows 90–150s, the playbook's video max is 120s, and 120s satisfies both. A 150s cut would need a re-run of the word budget and would most likely buy a second proof scene, not a longer mechanism."
  - "Black Thursday (March 2020) is used as the bold moment although it happened to MakerDAO and not to Medici; the playbook prefers 'ideally to us', and no Medici incident of that shape exists in the corpus (no live collateral has ever been held)."
  - "Deck timing assumes ~10 minutes spoken as the brief states; the playbook's own ideal is 6 minutes at 11 slots. At 10 minutes and 14 slots, per-slot time (50s) is above the 40s floor, so the longer slot count is affordable — but a 6-minute cut would have to drop d5 and d10 first."
