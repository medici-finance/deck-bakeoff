assumptions:
  - "Recorded, not asked: the audience is the one named in BRIEF.md; no human was interviewed and no question stalled this pass."
  - "The capital asks in both source decks are out of scope for this artifact, per BRIEF.md ('the ask is a conversation, not funding'). Any design that reintroduces a funding ask has changed the genre."
  - "The underlying is left unnamed on every slot on purpose. The corpus contradicts itself — the decks sell tokenized fund shares and MMFs, the research concludes near-zero-volatility collateral is the worst fit and names tokenized gold first. d12 asks the buyer to name their own underlying, which is honest under either reading."
  - "Roadmap and scale figures are as-of July 2026 and the venue figures are as-of March 2026. Both are stale at presentation time; the as-of date belongs in visible text, not a footnote."
